# Kernel track for this branch. Every script sources this file.
KV=6.18.64                 # kernel.org release
SKY1_COMMIT=57e018a        # Sky1-Linux/linux-sky1 commit
SKY1_PATCHES=patches       # patch track directory (LTS)
SKY1_CONFIG=config.sky1    # config in linux-sky1/config/
# Sky1-Linux patches are made for 6.18.14. The ones that no longer apply to $KV are rebased
# (3-way merge, conflicts resolved by hand) and kept in this repo under patches/$KV/ with the
# same file names; they replace the upstream file of that name.
SKY1_REFRESHED=patches/$KV
# Strict by default: any patch that does not apply exactly stops the build. ALLOW_FUZZ=1 falls
# back to `patch -F3` (logged in $WORK/patch.log) for quick experiments only: fuzz can put a hunk
# in the wrong place without failing (it did for 0074 arm_scmi on 6.18.64).
ALLOW_FUZZ=${ALLOW_FUZZ:-0}
