# Kernel tracks. Every script sources this file.
#
#   KERNEL_TRACK=7      kernel.org 7.3.5 + this repo's forward port of the Sky1 patches (default since v2026.11.24, see docs/KERNEL-7.md)
#   KERNEL_TRACK=6.18   kernel.org 6.18.64 LTS + Sky1-Linux patches (the long-tested alternative)
#
# Pick a track with the environment, e.g. `KERNEL_TRACK=6.18 scripts/setup.sh`. Both tracks build into the same
# $WORK (in $WORK/linux-$KV), but only one kernel is staged in /boot/sky1 at a time.
# Without KERNEL_TRACK, the track recorded by the last `setup.sh stage` in $WORK/.kernel-track is used,
# so `setup.sh check` and later runs stay on the track that was installed.
if [ -z "${KERNEL_TRACK:-}" ] && [ -f "${WORK:-$HOME/sky1-build}/.kernel-track" ]; then
  KERNEL_TRACK=$(cat "${WORK:-$HOME/sky1-build}/.kernel-track")
fi
# A board set up before tracks were recorded (only the 6.18 step marker $WORK/.setup-stage) stays on 6.18, so the
# change of default to 7 never switches an installed board by surprise.
if [ -z "${KERNEL_TRACK:-}" ] && [ -f "${WORK:-$HOME/sky1-build}/.setup-stage" ]; then
  KERNEL_TRACK=6.18
fi
KERNEL_TRACK=${KERNEL_TRACK:-7}
SKY1_COMMIT=57e018a        # Sky1-Linux/linux-sky1 commit
# Strict by default: any patch that does not apply exactly stops the build. ALLOW_FUZZ=1 falls
# back to `patch -F3` (logged in $WORK/patch.log) for quick experiments only: fuzz can put a hunk
# in the wrong place without failing (it did for 0074 arm_scmi on 6.18.64).
ALLOW_FUZZ=${ALLOW_FUZZ:-0}
case "$KERNEL_TRACK" in
  6.18|6|lts)
    KERNEL_TRACK=6.18
    KV=6.18.64                 # kernel.org release
    SKY1_PATCHES=patches       # patch track directory in linux-sky1 (LTS)
    SKY1_CONFIG=config.sky1    # config in linux-sky1/config/
    # Sky1-Linux patches are made for 6.18.14. The ones that no longer apply to $KV are rebased
    # (3-way merge, conflicts resolved by hand) and kept in this repo under patches/$KV/ with the
    # same file names; they replace the upstream file of that name. patches/$KV/post/*.patch are
    # applied after the series (API changes in $KV that the series predates).
    SKY1_REFRESHED=patches/$KV
    LOCAL_PATCHES=
    KCONFIG_EXTRA=
    RELEASE_TAG_DEFAULT=v2026.11.23
    ;;
  7|7.3)
    KERNEL_TRACK=7
    KV=7.3.5                   # kernel.org release
    SKY1_PATCHES=patches-next  # Sky1 track the port in LOCAL_PATCHES was made from (not applied directly)
    SKY1_CONFIG=config.sky1-next  # config in linux-sky1/config/
    SKY1_REFRESHED=
    # Sky1 has no 7.x patch set, so this repo carries the forward port. These patches (relative to
    # the repo) are applied instead of linux-sky1/$SKY1_PATCHES. They were generated against $KV
    # exactly, so fuzz is never needed. See docs/KERNEL-7.md.
    LOCAL_PATCHES=patches/7.3
    # Extra scripts/config arguments for this track. The CIX display drivers (linlon-dp DPU, trilin DP)
    # do not build on 7.x yet (DRM private-object and panel API changes), and the board runs headless.
    KCONFIG_EXTRA="--disable DRM_CIX --disable DRM_CIX_EDP_PANEL"
    RELEASE_TAG_DEFAULT=v2026.11.24
    ;;
  *) echo "kernel.conf: unknown KERNEL_TRACK '$KERNEL_TRACK' (use 6.18 or 7)" >&2; exit 2 ;;
esac
