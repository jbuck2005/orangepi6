# Kernel track for this branch. Every script sources this file.
KV=6.18.64                 # kernel.org release
SKY1_COMMIT=57e018a        # Sky1-Linux/linux-sky1 commit
SKY1_PATCHES=patches       # patch track directory (LTS)
SKY1_CONFIG=config.sky1    # config in linux-sky1/config/
